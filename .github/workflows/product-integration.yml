name: product-integration
# The R-3 seam gate. `ci.yml` proves the protocol is internally green; this proves the PRODUCT repo still
# compiles and passes against protocol code that has NOT been published yet.
#
# Why it exists: the product repo consumes @integraledger/* from the private registry, so a source-breaking
# protocol change is invisible to it until after the protocol publishes — which puts the break on the wrong
# side of an act that, once a version number is used, cannot be taken back. Without this gate, the only way to validate a breaking change ahead of
# publishing is to hand-copy dist/ over the pnpm store and remember to restore it.
#
# NOT a violation of the no-link canon. `pnpm pack` produces the exact tarball the release stages, and the
# product repo installs THAT. A workspace link would prove nothing about the published
# artifact; a tarball proves everything except the registry hop, which ci.yml in the product repo already
# covers on every push.
on: [push]

# `packages: read` is load-bearing, not boilerplate: the product repo's own dependencies still install from
# the private GH registry using GITHUB_TOKEN — only the @integraledger/* specifiers are redirected to the
# packed tarballs. Without it the final `pnpm install` 403s on everything else in the tree.
permissions:
  contents: read
  packages: read

concurrency:
  group: product-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Require the cross-repo credential
        # Fail LOUDLY and self-explainingly rather than as an opaque 403 from actions/checkout.
        # GITHUB_TOKEN is scoped to this repo only, so the private sibling checkout needs its own
        # credential: a READ-ONLY DEPLOY KEY on IntegraLedger/integra-agentic-commerce, whose private half
        # lives here as PRODUCT_INTEGRATION_SSH_KEY.
        #
        # A deploy key rather than a PAT, deliberately. A fine-grained PAT would be equivalent in scope
        # (Contents:read on one repo) but is bound to whoever minted it — it expires on their schedule and
        # dies with their account. A deploy key belongs to the repository, is read-only by construction,
        # cannot reach any other repo in the org, and is creatable via the API (PAT creation is UI-only).
        #
        # If this step fails the seam is UNGATED — failing is the point, not an inconvenience.
        # The secret goes through `env`, never inline in `run`: the `secrets` context is not dependable
        # in a step-level `if`, and env is the injection-safe form regardless.
        env:
          KEY: ${{ secrets.PRODUCT_INTEGRATION_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::PRODUCT_INTEGRATION_SSH_KEY is not set — the R-3 seam is ungated."
            echo "Add a read-only deploy key to IntegraLedger/integra-agentic-commerce and store its"
            echo "PRIVATE half here as the PRODUCT_INTEGRATION_SSH_KEY secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: protocol }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # This job checks the protocol out under protocol/, so the workspace ROOT has no package.json and
        # the action cannot find `packageManager` on its own. Every other workflow checks out to the root
        # and needs no such pointer.
        with: { package_json_file: protocol/package.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: protocol/.nvmrc
          cache: pnpm
          cache-dependency-path: protocol/pnpm-lock.yaml
          # registry-url is what makes setup-node write the .npmrc auth line that binds NODE_AUTH_TOKEN.
          # Without it the product install 401s: the overrides cover @integraledger/*, but the product repo
          # also resolves other packages, and its own .npmrc points the scope at the private registry with
          # no credential of its own.
          registry-url: "https://npm.pkg.github.com"

      - name: Build the protocol
        working-directory: protocol
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: Pack every publishable package
        working-directory: protocol
        # Private packages have no published surface and are never packed. The set is derived from
        # `private` in each manifest, never a name pattern — a name filter stops being correct the
        # moment a package is renamed or a second private package appears.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          for dir in packages/*/; do
            node -e "process.exit(require('./${dir}package.json').private ? 1 : 0)" || continue
            ( cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs" )
          done
          ls -1 "$GITHUB_WORKSPACE/tarballs"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IntegraLedger/integra-agentic-commerce
          # ssh-key, not token: checkout switches the remote to SSH and authenticates as the deploy key,
          # which can read this one repository and nothing else.
          ssh-key: ${{ secrets.PRODUCT_INTEGRATION_SSH_KEY }}
          path: product

      - name: Point the product repo at the packed tarballs
        working-directory: product
        # Overrides redirect every @integraledger/* specifier — transitive ones included — to the tarball
        # packed above. Applied only in this runner; nothing is committed.
        #
        # THEY GO IN pnpm-workspace.yaml, NOT package.json. pnpm 11 moved `overrides` out of the `pnpm`
        # field and now IGNORES it there, with only a warning:
        #   [WARN] The "pnpm" field in package.json is no longer read by pnpm ... ignored: "pnpm.overrides"
        # A warning, not an error, so the install proceeded, resolved @integraledger/* from the registry as
        # if this step had never run, and the job "verified" nothing. That is the failure mode this gate
        # exists to prevent, reproduced inside the gate itself.
        #
        # Inserted directly beneath the existing `overrides:` key rather than appended to the file: the
        # product repo already overrides axios/uuid/qs for transitive CVEs, and those must survive. Order
        # within a YAML mapping is irrelevant, so inserting at the top of the block is safe wherever the
        # block sits.
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = path.join(process.env.GITHUB_WORKSPACE, "tarballs");
            const entries = [];
            for (const f of fs.readdirSync(dir).sort()) {
              if (!f.endsWith(".tgz")) continue;
              // integraledger-verify-0.6.0.tgz -> @integraledger/lcp-verify
              const name = f.replace(/-\d+\.\d+\.\d+.*\.tgz$/, "").replace(/^integraledger-/, "");
              entries.push(["@integraledger/" + name, "file:" + path.join(dir, f)]);
            }
            if (entries.length === 0) throw new Error("no tarballs packed — nothing to override");
            const p = "pnpm-workspace.yaml";
            const lines = fs.readFileSync(p, "utf8").split("\n");
            const block = entries.map(([k, v]) => `  "${k}": "${v}"`);
            const at = lines.findIndex((l) => /^overrides:\s*$/.test(l));
            if (at === -1) lines.push("overrides:", ...block, "");
            else lines.splice(at + 1, 0, ...block);
            fs.writeFileSync(p, lines.join("\n"));
            console.log("overrides applied to pnpm-workspace.yaml:");
            for (const [k] of entries) console.log("  " + k);
          '
          # Prove the redirection is actually live rather than trusting the write: if pnpm ignores it again,
          # this prints nothing and the step fails here instead of silently verifying against the registry.
          grep -q "@integraledger/lcp-kernel\": \"file:" pnpm-workspace.yaml

      - name: Verify the product against unreleased protocol
        working-directory: product
        # --no-frozen-lockfile is REQUIRED here and only here: the overrides deliberately diverge from the
        # committed lockfile. That divergence is the whole experiment.
        #
        # `lcp-conformance` runs BESIDE `pnpm verify`, not inside it — it is a separate step in the
        # product's own ci.yml and running verify alone therefore skipped it here. That left the corpus
        # out of the seam this job exists to gate: the product pins a published `@integraledger/lcp-conformance`
        # and only ever reads three vector files from it as fixtures, so a corpus that GREW in this repo
        # (the 30-case chain-walk custody set, say) was never once executed against product code until
        # after a release. The overrides above redirect `@integraledger/lcp-conformance` to the freshly packed
        # tarball, so invoking it here is what makes this an R-3 gate over the whole corpus.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec lcp-conformance
          pnpm verify
