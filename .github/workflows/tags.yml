name: tags

# Reconcile git tags against what is actually published, on a schedule and on demand.
#
# ⛔⛔ WHY THIS IS A WORKFLOW AND NOT A STEP IN THE RELEASE, AND THIS IS THE REPOSITORY IT COST.
# Tagging happens inside `approve-staged.mjs`, so it happens only when a maintainer approves by running
# that script. Approving in the npm web UI is the same 2FA proof-of-presence and is entirely legitimate —
# and it never reaches the script, so the repository goes untagged with nothing reporting it. FIVE
# CONSECUTIVE RELEASES went out that way here: 0.12.0 through 0.13.0, 155 tags, reconstructed by hand
# from provenance on 2026-08-26. It looked like a bug in the tagging code for a long time and was not.
#
# ⭐ A step that runs on only one of several legitimate paths is not a step, it is a coincidence. This
# asks the registry and each version's own provenance instead, so it is correct after a script approval,
# a web approval, or a publish nobody remembers making.
#
# The reconciler needs NO npm auth — provenance and the packument are public reads.

# ⛔⛔ THERE WAS A `workflow_run` TRIGGER OFF `release` HERE AND IT COULD NEVER HELP, BY CONSTRUCTION.
# `release` STAGES; it does not publish. Publication is a separate human act — a 2FA approval that happens
# minutes or hours later, from a script or from the npm web UI. So a run chained to `release` fires at a
# moment when the versions it exists to tag are, necessarily, still unpublished: `installable()` refuses
# them and the run reports "staged, not published — no tag" and exits 0.
#
# ⚠️ MEASURED 2026-09-10, and it is the reason this comment is here rather than a tidier trigger. The
# 0.17.0 release staged at 15:58Z; this workflow ran at 16:01:46Z off that very event and reported
# SUCCESS; the maintainer approved afterwards; and **30 of 31 published versions then sat untagged over a
# green run** until a person happened to check. A trigger that fires when the answer is known to be
# "nothing to do" does not reduce latency — it manufactures a green run that means nothing, which is worse
# than no trigger at all.
#
# ⭐ This file's own header states the rule it broke: *a step that runs on only one of several legitimate
# paths is not a step, it is a coincidence.* No event in this repository correlates with an npm approval,
# so polling is the only honest mechanism and the cadence below is the whole answer.

on:
  schedule:
    # ⭐ HOURLY, and it is affordable because a steady-state run is nearly free: the loop short-circuits on
    # `remote.has(tag)` BEFORE fetching provenance or testing installability, so a fully-tagged line costs
    # 31 packument reads and nothing else. Only genuinely untagged versions cost more. The ceiling on
    # "published but unrecorded" is therefore an hour rather than a day.
    - cron: "23 * * * *"
  workflow_dispatch:

# ⚠️ LEAST PRIVILEGE IS PER-JOB. A top-level block would grant `contents: write` to every job added
# later; this one job needs it to push tags and nothing else does.
permissions: {}

concurrency:
  group: tags
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags — the only write this workflow performs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are written against the commit each version's provenance names, which is usually NOT the
          # tip. A shallow clone would not contain it and the reconciler would refuse rather than guess.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Reconcile tags against the registry
        shell: bash # `run:` defaults to `bash -e` WITHOUT pipefail; naming the shell is the house rule
        run: |
          # ⛔ `pipefail` because of the `tee` below: without it this step would report TEE's status and a
          # failed reconcile would land under a green tick — the exact shape this workflow exists to stop.
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⛔ `|| status=$?` so `bash -e` does not abort before the summary is written. The summary is the
          # point: a run that wrote 30 tags and a run that had nothing to do are both "success", and until
          # now the only way to tell them apart was to open the log.
          status=0
          node scripts/reconcile-tags.mjs --write 2>&1 | tee /tmp/reconcile-tags.log || status=$?
          {
            echo "### tags"
            echo
            echo '```'
            grep -E "^reconcile-tags —|^wrote and confirmed" /tmp/reconcile-tags.log \
              || echo "(the reconciler printed no summary line — read the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
