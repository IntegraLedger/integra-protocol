name: codeql
# Static security analysis. `verify` proves the code does what the tests say; CodeQL looks for the classes of
# defect tests are structurally bad at finding — injection, unsafe deserialization, path traversal, prototype
# pollution — by data-flow rather than by example.
#
# It matters here more than in an ordinary library because this repo's inputs are hostile by construction:
# every `binding-*` package decodes counterparty-supplied chain data, `evidence` fetches remote artifacts
# behind an SSRF guard, and `verify` walks an authority chain a counterparty authored.
#
# TWO REPOSITORY PREREQUISITES, both of which read as entitlement problems when they are absent and are
# not. On a PRIVATE repository: `security_and_analysis.code_security` must be enabled, and the job needs
# `actions: read` (see permissions). This repository is PUBLIC, where code scanning is available without
# that setting — measured 2026-08-11, `code_security` does not appear in its `security_and_analysis` at
# all — so neither prerequisite binds today. Both are recorded because they bind again the moment the
# repository goes private, which is the same trap `release.yml` documents for its own `actions: read`.
#
# RESULTS GO TO THE SECURITY TAB, and are ALSO gated in-job. The tab is a place to go and look; the gate
# fails the run. Where work lands directly on main, a finding that only appears somewhere you have to visit
# is a finding nobody sees until someone visits.
#
# Its own workflow rather than a step in `verify`: a full database build is minutes, and it has no business
# in the inner loop. Runs on push plus a weekly sweep, because the QUERIES improve even when the code does
# not, and a finding that only exists after a query update would otherwise never surface.
on:
  # Tags excluded for the reason ci.yml gives: a release pushes up to one tag per package at once.
  #
  # TAGS ARE EXCLUDED VIA `branches`, NOT `tags-ignore`, AND THE DIFFERENCE IS NOT COSMETIC. A `push` block
  # carrying only `tags-ignore` means "tags, minus these" — after ignoring `**` that is NOTHING, and the
  # workflow stops running on branch pushes entirely. Measured the hard way on 2026-08-12: commit 3b9b7e6
  # landed on main and ci, codeql and mutation all silently did not run. Branch and tag filters are
  # independent, so `branches: ["**"]` is the form that means "every branch, no tags".
  #
  # `**` and not `*`: Dependabot's branches contain slashes (`dependabot/npm_and_yarn/...`), which `*` does
  # not match. They must keep CI — dependabot.yml relies on a red build to hold the 24h quarantine.
  push:
    branches: ["**"]
  workflow_dispatch: # re-run on demand — e.g. after a repo security setting changes
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: read
  security-events: write # upload the SARIF to the Security tab
  # `actions: read` is REQUIRED for a private repository: the analyze step reads its own workflow-run
  # metadata, and without it the whole step 403s with "Resource not accessible by integration" — an error
  # that names the workflow-runs API and looks nothing like a permissions problem. It reads as optional on
  # a public repository, which is what this one is; it is declared anyway so going private does not break
  # the scan silently.
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: javascript-typescript
          # security-extended over the default pack: the default set is tuned to keep false positives near
          # zero for a general audience, and this codebase's threat model justifies the extra queries.
          queries: security-extended

      # No build step: the JS/TS analyzer extracts from source directly. Building first would add minutes and
      # analyse the emitted dist/ rather than the sources anyone reads.
      - uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: "/language:javascript-typescript"
          output: sarif-results

      - name: Fail on any error-severity finding
        # The gate. An uploaded SARIF alerts; it does not block. This turns an error-severity finding into
        # a red run, which is the only signal that reaches someone pushing to main.
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = "sarif-results";
            let errors = 0, total = 0;
            for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".sarif"))) {
              const sarif = JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8"));
              for (const run of sarif.runs ?? []) {
                // Severity lives on the RULE, not the result, so build the lookup first.
                const level = new Map();
                for (const rule of run.tool?.driver?.rules ?? [])
                  level.set(rule.id, rule.defaultConfiguration?.level ?? "warning");
                for (const r of run.results ?? []) {
                  total++;
                  const lvl = r.level ?? level.get(r.ruleId) ?? "warning";
                  const where = r.locations?.[0]?.physicalLocation?.artifactLocation?.uri ?? "?";
                  const line = r.locations?.[0]?.physicalLocation?.region?.startLine ?? "?";
                  console.log(`  [${lvl}] ${r.ruleId} — ${where}:${line}`);
                  if (lvl === "error") errors++;
                }
              }
            }
            console.log(`\n${total} finding(s), ${errors} at error severity`);
            if (errors > 0) {
              console.error(`::error::CodeQL reported ${errors} error-severity finding(s)`);
              process.exit(1);
            }
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results/
          retention-days: 30
