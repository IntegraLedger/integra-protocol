name: release

# Triggered by `ci` CONCLUDING, not by the push itself. `needs:` cannot express this — it orders jobs
# within one workflow, and `ci` is a separate file — so the dependency has to be a `workflow_run`.
#
# Why it must exist at all: on a `push` trigger this workflow raced `ci` and won. Measured on this repo,
# release finishes in 77-114s against ci's 286-294s, so a commit that breaks the suite could reach the
# registry ~3 minutes before the run that would have caught it went red. That was survivable on GitHub
# Packages. It is not survivable on npmjs, where `check-versions.mjs` already documents the reason:
# deleting a package's sole version burns the name permanently.
#
# A `workflow_run` trigger is silently inert on a freshly created repository. This repo was recreated on
# 2026-08-09 and the first THREE successful `ci` runs on main produced no release run at all — no queued
# run, no skipped run, nothing to find in the API. The fourth push wired it up and it has fired normally
# since. Nothing in the configuration below changed. If you have just recreated this repository and the
# release is missing, push again before you debug this file.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # A release must be re-runnable without a commit: `workflow_run` gives no manual entry point, so before
  # this existed a failed publish could only be retried by pushing something. The guards are identical on
  # this path — the staging step decides what to stage by asking the registry, not by trusting the trigger.
  workflow_dispatch:

# PUBLISHING MODEL — ruled 2026-08-08 (DS-4). Read this before changing any step below.
#
# Steady state is STAGE-ONLY TRUSTED PUBLISHING, and it has three properties worth stating because each
# one is why a step looks the way it does:
#
#   - No `NPM_TOKEN` exists. Authentication is OIDC, which is why `id-token: write` is required below.
#   - The trusted-publisher configuration on npmjs is stage-only, so the REGISTRY rejects a bare
#     `npm publish` from this workflow. The gate does not depend on this file being correct.
#   - Nothing is installable until a human approves the staged artifact with 2FA. The gate is applied to
#     the exact bytes going live, so it holds even if this workflow is compromised.
#
# WHY NOT `changeset publish`: @changesets/cli hardcodes the subcommand (`spawn(tool, ["publish", …])`)
# and exposes no hook to emit `npm stage publish`. Verified against 2.31.1. Changesets keeps versioning
# and changelogs; the publish loop below is ours. Derive the set from `private`, never a name pattern —
# a name filter has silently broken twice here.
#
# BOOTSTRAP: DONE, 2026-08-09, and not repeatable. npm can neither configure trusted publishing for a
# package that does not exist (npm/cli#8544) nor stage a brand-new name, so the first publish of the `lcp-*`
# names could not use this path at all; it ran once from Actions under a short-lived granular token and this
# workflow has owned publishing since. The bootstrap workflow was deleted rather than disabled, so no
# standing credential path remains — see AGENTS.md for what it taught, including why it had to run in
# Actions rather than from a laptop. A NEW package name added later needs that one-off again; it is a
# deliberate, supervised exception, not something to work around here.
#
# PROVENANCE: live. `npm publish --provenance` and GitHub artifact attestations both require a PUBLIC source
# repository, which D7 delivered by archive-and-recreate on 2026-08-09. `NPM_CONFIG_PROVENANCE` is set below
# and is now load-bearing rather than inert: every `lcp-*` at 0.9.0 carries an attestation on the registry.
# npm FAILS a publish it cannot attest rather than degrading to an unattested one, so if this repository is
# ever made private again this workflow starts failing — that is the intended behaviour, not a regression.
permissions:
  # READ only. No step here pushes anything: this workflow checks out, builds, packs, uploads an artifact
  # and stages. Tagging moved to `scripts/approve-staged.mjs`, which runs on a maintainer's machine at the
  # moment of approval — see the closing note. Write scope on the one workflow that also holds
  # `id-token: write` is worth not granting for a step that no longer exists.
  contents: read
  # OIDC. This is the whole of the publishing credential — there is no token to leak.
  id-token: write
  # For the dispatch gate below, which reads this commit's `ci` conclusion from the runs API. Declaring
  # any `permissions:` block sets every scope not named here to `none`, so this is not redundant with the
  # repository default — the same trap `codeql.yml` documents, where the omission 403s the whole step.
  # It reads as optional today only because a public repository serves that endpoint unauthenticated;
  # the gate would fail closed the moment this repository went private again.
  actions: read

concurrency:
  # Serialize, and NEVER cancel. The publish loop is non-atomic: it stages package by package, so
  # interrupting it mid-flight leaves part of a coordinated release staged and the rest not. Staging is
  # recoverable where publishing is not — a staged version can be rejected — but a half-staged release
  # still has to be reconciled by hand before approval.
  # Two rapid pushes to main must therefore queue behind each other rather than race or pre-empt.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # `workflow_run` fires on completion regardless of outcome, so the conclusion is checked here. Without
    # this the gate above would be decorative: a red `ci` would still trigger a green release.
    # On `workflow_dispatch` there is no `workflow_run` payload to read, so the equivalent check runs as a
    # step below against the API — the gate must hold on BOTH entry points or the manual one is a way round it.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the COMMIT `ci` actually verified. A `workflow_run` checkout defaults to the tip of the
          # default branch, which is not necessarily the tree that passed — a push landing during the ~5
          # minutes `ci` takes would otherwise publish an unverified commit under a green tick.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The dispatch half of the gate above. `workflow_run` proves `ci` was green because it carries the
      # conclusion; a manual run proves nothing on its own, so ask the API whether THIS commit has a
      # successful `ci` run and refuse otherwise. Without this, dispatching is a one-click bypass of the
      # only thing standing between an unverified tree and the approval queue.
      - name: Require a green ci for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | first | .conclusion // "none"')
          echo "ci for ${SHA}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::refusing to release ${SHA}: its ci run concluded '${conclusion}', not success"
            exit 1
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: ".nvmrc", cache: "pnpm", registry-url: "https://registry.npmjs.org" }
      # `npm stage` needs npm >= 11.15.0, and .nvmrc pins a Node MAJOR — so the npm that arrives is
      # whatever that line currently bundles. Today Node 24 ships 11.16.0 and the command exists; a runner
      # that resolved an older 24.x would fail mid-loop with "Unknown command: stage", after packing and
      # uploading, which reads as a registry problem rather than a toolchain one. `approve-staged.mjs`
      # states the same floor for the approval half; this states it for the staging half, before any
      # package is touched.
      - name: Require an npm that has `stage`
        run: |
          need=11.15.0
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "::error::npm $have cannot stage; need >= $need. Bump .nvmrc or install npm@latest."
            exit 1
          fi
          echo "npm $have >= $need"

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Packed BEFORE staging so the retained artifacts are the exact tarballs the next step uploads, not a
      # later rebuild — the approval gate is only meaningful if the approved bytes are the kept bytes. Kept as its own step rather than folded away because it is also the
      # hook signed provenance would attach to if the plan ever allows it (see the header).
      - name: Pack the publishable set
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-tarballs"
          # The publishable set is derived from `private` in each manifest, never a name pattern: a name
          # filter silently stops being correct the moment a package is renamed or a second private
          # package appears — both have now happened. Same rule as scripts/publish-integrity.mjs.
          for dir in packages/*/; do
            node -e "process.exit(require('./${dir}package.json').private ? 1 : 0)" || continue
            ( cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs" )
          done
          ls -1 "$GITHUB_WORKSPACE/dist-tarballs"

      # SBOM over the resolved dependency graph — what a consumer needs to answer "am I exposed to CVE-X"
      # without re-resolving our lockfile. Syft reads the pnpm lockfile, so it reflects what was actually
      # installed for this build rather than what the manifests would permit.
      #
      # Unattested, per the header: signing it needs the same feature the provenance step needs. An
      # unsigned SBOM is still the useful half — it says WHAT is in the release; the signature would say
      # who built it. Retained for a year because a CVE disclosure routinely reaches back further than 90
      # days, and the question it answers is always asked about a release already in the field.
      - name: Generate the SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-integra-protocol.cyclonedx.json
          output-file: "${{ github.workspace }}/sbom.cyclonedx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-and-tarballs
          path: |
            ${{ github.workspace }}/sbom.cyclonedx.json
            ${{ github.workspace }}/dist-tarballs/*.tgz
          retention-days: 365

      - name: Stage the publishable set
        run: |
          # `bash -e` does NOT fail a pipeline on a non-final command, so `npm stage publish | tee` reported
          # tee's status — always 0. Both the skip and the hard-fail branch below were therefore unreachable,
          # and the first real run of this workflow rejected all 31 packages and still printed "staged 31"
          # under a green tick. A publishing step that cannot report its own failure is worse than none.
          set -o pipefail
          shopt -s nullglob
          staged=0
          published=0
          already=0
          for tarball in "$GITHUB_WORKSPACE"/dist-tarballs/*.tgz; do
            # `console.log`, not `process.stdout.write`: `read` returns non-zero when it reaches EOF without
            # a trailing newline, and under `bash -e` that non-zero kills the step on the first package.
            read -r name version < <(tar -xzOf "$tarball" package/package.json |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(`${j.name} ${j.version}`)})')
            echo "::group::$name@$version"
            # Ask the registry BEFORE attempting, and ask the only endpoint that answers truthfully: the
            # packument and `npm view` both serve cached documents that can still omit a version minutes
            # after it went live (AGENTS.md records the bootstrap this cost). Deciding here is what makes a
            # no-op push a green no-op, rather than leaving that decision to a parse of npm's English.
            if curl -sf -o /dev/null "https://registry.npmjs.org/$name/$version"; then
              echo "$version is LIVE on the registry — skipping"
              published=$((published+1))
            elif npm stage publish "$tarball" 2>&1 | tee /tmp/stage.log; then
              staged=$((staged+1))
            elif grep -qiE "previously published|already staged|cannot publish over|already exists" /tmp/stage.log; then
              # ALREADY STAGED, awaiting approval — which is NOT published, and the distinction is the
              # whole point of this workflow. npm answers a second `stage publish` with 409 "Cannot stage
              # previously published version", wording that reads as though the version went live. The curl
              # above is what tells them apart: it 404s for a staged version and 200s for a live one, so
              # reaching this branch means staged.
              #
              # This is what makes a re-run a safe no-op, and it used to LIE about it. On 2026-08-12 a
              # re-run of an already-staged release printed "appeared on the registry mid-run" thirty-one
              # times and summarised "skipped 31 already on the registry" — while every one of those
              # versions was 404 and nothing was installable. A maintainer reading that log would have
              # concluded the release had shipped.
              echo "$version is ALREADY STAGED and awaiting approval — skipping"
              already=$((already+1))
            else
              echo "::error::staging failed for $name@$version"; exit 1
            fi
            echo "::endgroup::"
          done
          echo "staged $staged; already staged (awaiting approval) $already; live on the registry $published"
          if [ "$((staged + already))" -gt 0 ]; then
            echo "NONE of the $((staged + already)) staged version(s) are installable until approved with 2FA"
            echo "approve with: pnpm release:approve — it tags exactly what the registry confirms live"
          else
            echo "nothing to release — every version in this tree is already live"
          fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # NO TAGS ARE PUSHED HERE, and that is deliberate. `changeset publish` used to create one annotated
      # tag per published package in the runner; this workflow only STAGES, and a staged version is not
      # published — it can still be rejected. A tag for a version that never went live is a worse record
      # than no tag at all, which is the rule this file already applied when it pushed tags after publish
      # rather than before.
      #
      # Tagging moves to the moment of approval, where a version actually becomes installable:
      # `scripts/approve-staged.mjs` tags exactly what it approved and pushes those refs. It runs on a
      # maintainer's machine under their own credentials, so this workflow needs no write scope — and the
      # permissions block above grants none.
