name: published-dist-parity

# ⛔⛔ SEPARATE FROM `published-parity.yml` DELIBERATELY, AND NOT BECAUSE OF TIDINESS. That workflow's own
# comment states its defining property — "No `cache: pnpm`: nothing is installed here, so there is nothing
# to cache." This gate REBUILDS each package to compare the published `dist/` against what its own source
# emits, so it needs an install and a build. Folding it in would quietly retire that property and make a
# registry-reading job depend on a toolchain, which is a different risk profile and should be visible as a
# different workflow rather than hidden inside an existing one.
#
# ⚠️ NOT IN `verify`, for the reason the sibling gate is not: it reaches a third party, and
# `check-hermetic-tests.mjs` states the consequence — "a gate that reaches a third party fails red for a
# reason that is not in the tree."
#
# ⛔⛔ AND SINCE 2026-09-16 THIS WORKFLOW IS THE *ONLY* LIVE DRIVER OF THIS GATE. `published-dist-parity-invariant.test.ts`
# used to carry a live control — the real registry, real tarballs, a real root build — inside `pnpm verify`.
# It reddened the one commit a release is made of: every publishable package is ONE fixed group in
# `.changeset/config.json`, so `changeset version` leaves all of them unpublished at once, the gate skips
# every one, `compared` is 0 and the verdict is `unmeasured`. ⛔ The count is deliberately not written here:
# `DIST_FLOOR` in `scripts/check-published-dist-parity.mjs` is the source of truth and the gate prints what
# it compared, so a number copied into a comment is one more thing to go stale the day a package joins. `ci` reds, and `release.yml` fires only off
# a green `ci` on both of its entry points — so the packages could not be published until the release ran
# and the release could not run until they were published. Ruled 2026-09-16; tracked on the planning
# register as row 281. The test file keeps every INJECTED case and is now hermetic end to end.
#
# ⇒ THE CONSEQUENCE FOR THIS FILE: `unmeasured` is a REPORTED state here and not a red, because at a bump
# commit a run that opened no published dist is telling the truth. Everything else the gate can answer reds
# the job — see the verdict step at the bottom, which is what keeps "reported" from meaning "silent".
#
# ⛔ WHY THERE IS NO `workflow_run` OFF `release.yml`, which is the obvious thing to reach for. That
# workflow only STAGES: nothing is installable until a human approves the staged bytes with 2FA, so a run
# triggered by it would ask the registry about versions that are not there yet and answer `unmeasured` a
# second time. The read that matters is the first SCHEDULED run after approval — within six hours — or a
# `workflow_dispatch` by whoever approved.
#
# The minute is offset off the hour and off this repository's sibling (:23). A
# published version is immutable, so an overlap could not make any of them ambiguous about what it saw;
# the offset is only to avoid queueing behind everything GitHub runs at :00.
on:
  schedule:
    - cron: "07 */6 * * *"
  workflow_dispatch:

concurrency:
  group: published-dist-parity
  cancel-in-progress: true

env:
  # ⛔ `gh` resolves its repository from the local checkout and does not read `GITHUB_REPOSITORY`; setting
  # `GH_REPO` keeps the reporting steps working even if the checkout is what failed.
  GH_REPO: ${{ github.repository }}
  DRIFT_TITLE: "published-dist-parity: the published dist/ is not what this source emits"
  UNMEASURED_TITLE: "published-dist-parity: nothing was compared, so there is no parity claim"
  FAULT_TITLE: "published-dist-parity: the check could not measure — instrument failure"

jobs:
  dist-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      # ⛔ The rebuild must use the toolchain this repository pins. `--frozen-lockfile` is the whole
      # reason a rebuild can be compared byte for byte at all: a floating TypeScript would emit different
      # output and the gate would report drift about a compiler rather than about an artifact.
      - run: pnpm install --frozen-lockfile

      - name: Rebuild each published version's dist and compare it to what shipped
        id: parity
        # ⛔⛔ THE EXIT CODE IS CAPTURED RATHER THAN ALLOWED TO FAIL THE STEP — this gate has FIVE answers
        # and FOUR of them are not "pass": 1 drift, 2 nothing compared, 3 the instrument failed, 4 a stale
        # floor, 0 parity. Letting the step fail collapses them into one red and the reporting below would
        # file "the published dist is wrong" over a run that measured nothing. ⚠️ This read "four answers
        # and three of them", while listing four non-pass codes — the sentence contradicted its own list.
        #
        # ⚠️ `shell: bash` is not for pipefail — this step cannot fail. `PIPESTATUS` does not exist in `sh`,
        # which is what a bare `run:` may fall back to, and `PIPESTATUS[0]` is the whole mechanism.
        #
        # ⛔ CAPTURING IS NOT SWALLOWING. The code is read back by the verdict step at the bottom, which is
        # where this job decides whether it is red. Before that step existed every outcome — drift included
        # — left a GREEN tick with an issue beside it, so the job's own status distinguished nothing.
        shell: bash
        run: |
          set +e
          node scripts/check-published-dist-parity.mjs 2>&1 | tee /tmp/dist-parity.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "check:published-dist-parity exited $CODE"
          exit 0

      # ⛔ THE RUN CLOSES WHAT THE RUN OPENED. ⚠️ Only exit 0 closes: a 2, 3 or 4 means the question was not
      # answered, and closing a drift issue because the instrument broke retracts a finding on no evidence.
      - name: Close every issue this job opens, once parity is measured and holds
        if: steps.parity.outputs.code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for TITLE in "$DRIFT_TITLE" "$UNMEASURED_TITLE" "$FAULT_TITLE"; do
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
            [ -z "$EXISTING" ] && continue
            gh issue close "$EXISTING" --comment "$(printf 'Closed by the run that measured it: every published dist/ rebuilds byte for byte from the source it was cut from.\n\n[Run log](%s)\n' "$RUN_URL")"
          done

      - name: Open or update the DRIFT issue
        if: steps.parity.outputs.code == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf 'The `dist/` a consumer loads is not what this source emits. Files are named below as MISSING, as unexpected, or as DIFFERENT in content.\n\n⛔ A republish of the same version is not the remedy and is not possible: a version number is a promise about bytes. **The remedy is a version bump and a release.**\n\n⚠️ If the toolchain moved, this is still true — the published artifact no longer corresponds to its source. Republish; do not weaken the gate.\n\n[Run log](%s)\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(cat /tmp/dist-parity.log)")
          EXISTING=$(gh issue list --state open --search "$DRIFT_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$DRIFT_TITLE" --body "$BODY"; fi

      - name: Open or update the NOTHING-MEASURED issue
        if: steps.parity.outputs.code == '2' || steps.parity.outputs.code == '4'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf 'This run compared fewer published `dist/` trees than the floor, or none at all. ⛔ That is not a pass: a tick here would be a statement about artifacts the run never opened.\n\n[Run log](%s)\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(cat /tmp/dist-parity.log)")
          EXISTING=$(gh issue list --state open --search "$UNMEASURED_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$UNMEASURED_TITLE" --body "$BODY"; fi

      - name: Open or update the INSTRUMENT-FAILURE issue
        if: steps.parity.outputs.code == '3'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf 'The check could not measure. ⛔ This is NOT a product finding: the registry, a tarball or the rebuild failed, and nothing is being claimed about any published artifact.\n\n[Run log](%s)\n\n```\n%s\n```\n' \
            "$RUN_URL" "$(cat /tmp/dist-parity.log)")
          EXISTING=$(gh issue list --state open --search "$FAULT_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$FAULT_TITLE" --body "$BODY"; fi

      # ⛔⛔ THE JOB'S STATUS IS THE VERDICT, AND EXACTLY ONE ANSWER IS DELIBERATELY GREEN WITHOUT BEING A
      # PASS. `unmeasured` (2) is what a release bump commit looks like from here and is REPORTED — a
      # summary line and an issue — because a red would be this gate standing between a release and its own
      # subject. Drift (1), an instrument fault (3) and a stale floor (4) are findings and RED the job.
      #
      # ⛔ AND AN UNMAPPED OR MISSING CODE IS RED, never a pass. An earlier step that failed leaves this
      # output empty, and a gate that grew a sixth verdict would otherwise fall through to a green tick —
      # which is the empty-subject-set defect wearing a case statement.
      #
      # ⚠️ `if: always()` so this runs when an earlier step failed: a job whose gate never ran has no
      # verdict, and no verdict is not parity.
      - name: The verdict — a job status and a summary line for every answer this gate can give
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.parity.outputs.code }}
        run: |
          case "$CODE" in
            0) LINE="✓ parity — every published dist/ was rebuilt from its own source and matched byte for byte." ; FAIL=0 ;;
            1) LINE="✕ DRIFT — the dist/ a consumer loads is not what this source emits. The issue this run opened names the files. The remedy is a version bump and a release, never an adjustment to the gate." ; FAIL=1 ;;
            2) LINE="⚠ UNMEASURED — this run opened no published dist/, so it has no parity claim to make. REPORTED, not red: the publishable packages are one fixed group, so a release bump leaves every one of them unpublished until the staged versions are approved, and this is what that commit looks like from here — the counts for this run are in the gate output above. ⛔ Still unmeasured after a release has been approved and gone live is a finding — read the issue." ; FAIL=0 ;;
            3) LINE="✕ THE INSTRUMENT FAILED — the registry, a tarball or the rebuild failed. Nothing is being claimed about any published artifact; this is not a product finding." ; FAIL=1 ;;
            4) LINE="✕ STALE FLOOR — a package joined or left the publishable set and DIST_FLOOR did not move with it. Raise it when one joins; never lower it to quieten one that left." ; FAIL=1 ;;
            "") LINE="✕ the gate never ran — an earlier step failed, so there is no verdict. No verdict is not parity." ; FAIL=1 ;;
            *) LINE="✕ check:published-dist-parity exited $CODE, which this workflow has no mapping for. An unmapped exit is a fault, never a pass." ; FAIL=1 ;;
          esac
          echo "$LINE" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$FAIL"
