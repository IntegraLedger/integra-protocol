name: drift-guard
# Does the DEPLOYED escrow still match the source `binding-evm-escrow` is pinned to?
#
# Every derivation in that package is transcribed from `AuthCaptureEscrow` at
# `base/commerce-payments @ 98b592b`. The unit suite proves the transcription is self-consistent; it cannot
# prove the contract still hashes the way the pinned source says. That premise is what this checks, by
# reading the live chain and comparing it against the SHIPPED functions.
#
# WEEKLY, not per-push, and the distinction is the point: this guards against something that changes on the
# chain's schedule rather than on ours. A failure is never caused by the commit that triggered it, so
# attaching it to `push` would blame the wrong change and add four public-RPC reads to every commit.
#
# It is deliberately NOT part of `verify`, `ci` or `mutation`. The cases live in `drift/*.drift.ts`, which
# vitest's default `include` does not match, so only this workflow's `pnpm drift` reaches them. Dropped into
# `test/`, they would run under Stryker once per mutant — hundreds of RPC round-trips per job, where a
# rate-limited read that throws scores as a KILLED mutant and the instrument reports a better number for a
# worse suite.
#
# No secrets. Four read-only view calls over each chain's default public endpoint; the optional
# BASE_*_RPC_URL variables only raise rate limits.
on:
  schedule:
    # Mondays 06:00 UTC — a working-week morning, so a red lands when someone is around to read it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-guard
  cancel-in-progress: false

jobs:
  fork-derivation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: ".nvmrc", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
        # The guard imports the package's own `src/`, and workspace packages consume each other through
        # built `dist/` — so the build is required, not incidental.
      - run: pnpm -r build
      - name: Read the deployed escrow and compare against the pinned derivations
        run: pnpm --filter @integraledger/lcp-binding-evm-escrow drift
