name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A DCO sign-off and no agent trailer on every commit in the checked commit's history
        env:
          EXEMPT: 9dbb65d8c408e1234ef5661fb5a287db3522480e
        run: |
          set -euo pipefail
          unsigned=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' "$GITHUB_SHA" |
            awk -v exempt="$EXEMPT" 'NF<2 && $1 != exempt')
          agent=$(git rev-list "$GITHUB_SHA" | grep -vx "$EXEMPT" | while read -r c; do
            git show -s --format=%B "$c" | grep -Ei 'co-authored-by|generated with|claude|anthropic' | sed "s/^/${c:0:12} /" || true
          done)
          [ -z "$unsigned" ] || printf 'commits without a Signed-off-by: trailer:\n%s\n' "$unsigned"
          [ -z "$agent" ] || printf 'commit messages naming an agent:\n%s\n' "$agent"
          if [ -n "$unsigned" ] || [ -n "$agent" ]; then exit 1; fi
          echo "$(git rev-list --count "$GITHUB_SHA") commits reachable from $GITHUB_SHA: each but $EXEMPT is signed off and names no agent"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: One-way imports (no package here depends on or imports another @integraledger package)
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const allowed = () => [];
          const code = /\.(?:[cm]?[jt]s|tsx)$/;
          const specifier = /(?:\bfrom|\bimport|\brequire\s*\()\s*\(?\s*["'](@integraledger\/[^"'/]+)/g;
          let packages = 0;
          let bad = 0;
          for (const dir of fs.readdirSync(".").sort()) {
            const manifest = path.join(dir, "package.json");
            if (!fs.existsSync(manifest)) continue;
            packages++;
            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
            const ok = new Set([pkg.name, ...allowed(pkg.name)]);
            const found = [];
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              for (const name of Object.keys(pkg[field] ?? {})) {
                if (name.startsWith("@integraledger/")) found.push([name, `${manifest} ${field}`]);
              }
            }
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                if (e.name === "node_modules" || e.name === "dist" || e.name.startsWith(".")) continue;
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (code.test(e.name)) {
                  for (const m of fs.readFileSync(p, "utf8").matchAll(specifier)) found.push([m[1], p]);
                }
              }
            };
            walk(dir);
            for (const [name, where] of found) {
              if (!ok.has(name)) {
                console.log(`${where}: ${name}`);
                bad++;
              }
            }
          }
          if (packages === 0) {
            console.log("no package.json one level down: nothing was checked");
            process.exit(1);
          }
          if (bad > 0) process.exit(1);
          console.log(`${packages} package(s): no @integraledger dependency or import outside the allowed set`);
          EOF
      - name: Every job that runs Node.js fetches the one .node-version names, and checks it against one SHA-256
        run: |
          set -eu
          v="$(cat .node-version)"
          test "$(node --version)" = "v$v"
          url="https://nodejs.org/dist/v$v/node-v$v-linux-x64.tar.xz"
          test -z "$(grep -ho 'https://nodejs\.org/dist/v[0-9][^ ]*' .github/workflows/*.yml | grep -vxF "$url" || true)"
          digest=$(grep -hoE "^ +echo \"[0-9a-f]{64}  \\\$RUNNER_TEMP/node-v$v-linux-x64\\.tar\\.xz\" \\| sha256sum -c -\$" .github/workflows/*.yml | sed -E 's/^ +echo "([0-9a-f]{64}).*/\1/' | sort -u)
          test "$(printf '%s\n' "$digest" | grep -c .)" -eq 1
          for f in .github/workflows/*.yml; do
            awk -v url="$url" -v digest="$digest" -v file="$f" '
              function report() {
                if (job != "" && runs > 0 && (fetched != 1 || checked != 1)) {
                  printf "%s: job %s runs Node.js with %d fetch of %s and %d sha256sum -c of its digest\n", file, job, fetched, url, checked
                  bad = 1
                }
              }
              /^jobs:$/ { injobs = 1; next }
              injobs && /^  [A-Za-z0-9_-]+:$/ { report(); job = $1; runs = 0; fetched = 0; checked = 0; next }
              index($0, "curl -fsSL -o \"$RUNNER_TEMP/node-v") && index($0, " " url) { fetched++; next }
              index($0, "echo \"" digest "  $RUNNER_TEMP/node-v") && / \| sha256sum -c -$/ { checked++; next }
              /(^|[ ;&|(])(node|npm|npx|pnpm)( |$)/ { runs++ }
              END { report(); exit bad }
            ' "$f"
          done
          echo "node $(node --version), npm $(npm --version): every job that runs Node.js fetches $url and checks it against $digest"
      - name: The install policy, in the workspace and the site
        run: |
          set -eu
          for f in pnpm-workspace.yaml website/pnpm-workspace.yaml; do
            grep -qx 'minimumReleaseAge: 1440' "$f"
            grep -qx 'trustPolicy: no-downgrade' "$f"
            grep -qx 'strictDepBuilds: true' "$f"
            other=$(grep -E '^[A-Za-z]' "$f" | sed 's/:.*//' | grep -vxE 'packages|minimumReleaseAge|trustPolicy|strictDepBuilds|allowBuilds|minimumReleaseAgeExclude|overrides' || true)
            inline=$(grep -E '^(allowBuilds|minimumReleaseAgeExclude): *[^ ]' "$f" || true)
            allowed=$(awk '/^[A-Za-z]/ { block = ($0 == "allowBuilds:"); next } block && NF && $NF != "false"' "$f")
            excluded=$(awk '/^[A-Za-z]/ { block = ($0 == "minimumReleaseAgeExclude:"); next } block && NF' "$f" | grep -vxF '  - "@integraledger/*"' || true)
            if [ -n "$other$inline$allowed$excluded" ]; then
              printf '%s weakens the install policy:\n%s\n' "$f" "$(printf '%s\n' "$other" "$inline" "$allowed" "$excluded" | grep .)"
              exit 1
            fi
          done
          echo "pnpm-workspace.yaml and website/pnpm-workspace.yaml set minimumReleaseAge 1440 (excluding only @integraledger/*), trustPolicy no-downgrade and strictDepBuilds, and allow no dependency build"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - name: The shared vectors, byte-exact
        run: pnpm --filter @integraledger/lcp exec vitest run test/vectors.test.ts test/core.test.ts

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @integraledger/lcp run build
      - name: The TypeScript samples in the READMEs and docs/ not marked no-check compile, run and print what the page shows
        run: node scripts/docs-samples.mjs
      - name: The generated reference pages and the README's pairing list match the package
        run: node scripts/docs-reference.mjs --check

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every page's last-updated date is its file's last commit, which only the full history gives.
          fetch-depth: 0
      - name: Fetch Node.js
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz
          echo "3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  $RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node-v26.11.1-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Fetch pnpm
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pnpm-12.11.2.tgz" https://registry.npmjs.org/pnpm/-/pnpm-12.11.2.tgz
          curl -fsSL -o "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.11.2.tgz
          echo "25a51652a196785af5f28bda6dfe8dc582ebefa4ac1d180221ce1390231c5fb76637822ea4b6e4633ce74acdcb0a77f725af11bad38177fdeddaee818a955cb9  $RUNNER_TEMP/pnpm-12.11.2.tgz" | sha512sum -c -
          echo "14aed029edb8018829a49c0ede6a68a18a6d76ebaf206a8a24f8b969cecc7675a48d4cb8e8905f621096d20ae7916282f1839fd31faf1af8ae42a2448f74a941  $RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm-exe.linux-x64-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/pnpm
          tar -xzf "$RUNNER_TEMP/pnpm-12.11.2.tgz" -C "$RUNNER_TEMP/pnpm" --strip-components=1 package/dist
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @integraledger/lcp run build
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - name: The committed API pages match the source
        working-directory: website
        run: |
          set -eu
          pnpm run api
          api="$(node --input-type=module -e 'import { DOCS_DIR } from "./src/lib/docs-dir.ts"; console.log(DOCS_DIR)')/reference/api"
          git diff --exit-code -- "$api"
          untracked=$(git ls-files --others --exclude-standard -- "$api")
          if [ -n "$untracked" ]; then printf 'API pages not committed:\n%s\n' "$untracked"; exit 1; fi
          echo "the API pages in $api match the source"
      - run: pnpm build
        working-directory: website
      - name: The site's home page and machine-readable files
        working-directory: website
        run: |
          set -eu
          for f in out/index.html out/llms.txt out/llms-full.txt; do
            test -s "$f" || { echo "missing or empty: website/$f"; exit 1; }
          done
          echo "out/index.html, out/llms.txt and out/llms-full.txt exist"
      - name: The Markdown copies hold no relative links
        working-directory: website
        run: |
          set -eu
          copies=$(find out/md -name '*.md' | wc -l)
          test "$copies" -gt 0 || { echo "website/out/md holds no Markdown copies"; exit 1; }
          # A link to ./x, ../x or x.md resolves against /<page>.md, where nothing is served.
          status=0
          grep -rnoE --include='*.md' '\]\((\.\.?/|[^):/#?[:space:]]+\.md[#)])' out/md || status=$?
          case "$status" in
            0) echo "the Markdown copies above hold relative links"; exit 1 ;;
            1) echo "none of the $copies Markdown copies in out/md holds a relative link" ;;
            *) exit "$status" ;;
          esac
      - name: The LCP documents the site publishes equal lcp/profiles/, each with its type and caching
        run: node scripts/check-lcp-documents.mjs --out website/out
      - name: Every link on the site has a name, and every fragment link finds its target
        run: node scripts/check-pages.mjs --out website/out
      - name: The code highlighting gives one result however long tokenizing takes, in the themes' colours
        working-directory: website
        run: node scripts/check-highlighting.mjs
      - name: Two builds of one commit are byte-equal
        working-directory: website
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          mv out "$RUNNER_TEMP/first-build"
          rm -rf .next
          pnpm build
          status=0
          diff -r --brief "$RUNNER_TEMP/first-build" out || status=$?
          case "$status" in
            0) ;;
            1) echo "two builds of $sha differ in the files above"; exit 1 ;;
            *) exit "$status" ;;
          esac
          test -d "out/_next/static/$sha" || { echo "the two builds are equal, but their build ID is not the commit's sha, $sha"; exit 1; }
          echo "two builds of $sha are byte-equal: $(find out -type f | wc -l) files, under the build ID $sha"
