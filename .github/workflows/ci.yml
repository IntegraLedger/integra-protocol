name: ci
on:
  # Work lands directly on main. A fork's PR therefore gets no CI — stated in CONTRIBUTING so a contributor
  # knows they cannot demonstrate green here, rather than discovering it.
  #
  # Why tags are excluded at all: `scripts/approve-staged.mjs` pushes one tag per approved package with a
  # single `git push --tags`, so a release would fire this workflow once per tag — a 31-package release
  # means 62 matrix jobs on one commit, none able to cancel the others because `concurrency` keys on
  # `github.ref` and every tag is a different ref.
  #
  # TAGS ARE EXCLUDED VIA `branches`, NOT `tags-ignore`, AND THE DIFFERENCE IS NOT COSMETIC. A `push` block
  # carrying only `tags-ignore` means "tags, minus these" — after ignoring `**` that is NOTHING, and the
  # workflow stops running on branch pushes entirely. Measured the hard way on 2026-08-12: commit 3b9b7e6
  # landed on main and ci, codeql and mutation all silently did not run. Branch and tag filters are
  # independent, so `branches: ["**"]` is the form that means "every branch, no tags".
  #
  # `**` and not `*`: Dependabot's branches contain slashes (`dependabot/npm_and_yarn/...`), which `*` does
  # not match. They must keep CI — dependabot.yml relies on a red build to hold the 24h quarantine.
  push:
    branches: ["**"]

# Least privilege, declared rather than inherited: without this block a job gets the repository default,
# which is org-configurable and historically read/write. This workflow only reads the tree.
permissions:
  contents: read

concurrency:
  # A superseded push has nothing left to prove — cancel its run instead of paying for it. Safe here
  # precisely because nothing in `ci` is outward-facing; contrast release.yml, which must never cancel.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `engines` promises `>=24` open-ended; a single-version CI never exercises that claim. The matrix
      # runs the floor (24, mirrors .nvmrc — move both together) and the newest current line, so "works on
      # every supported Node" is measured rather than asserted.
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10    # no version input — package.json's packageManager is the single source of truth
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify        # verify builds first (pnpm -r build): workspace packages consume each other via built dist/, so kernel must be built before conformance is typechecked/tested. Build also produces the dist/ + tarball publint/attw inspect below.
      # publish-integrity (publint + attw) runs on the packages that GET PUBLISHED. The script derives that
      # set from `private` in each manifest rather than a name pattern: a private package has no published
      # type/export surface and fails both gates by design, and the old name-pattern filter silently
      # stopped being correct the moment a SECOND private package existed. Packages are
      # intentionally ESM-only (§12); the esm-only profile ignores the expected node10/CJS resolution failures.
      - run: node scripts/publish-integrity.mjs

  # The documentation site (website/), built but never deployed — Cloudflare Pages deploys are
  # manual here, as they are for every Cloudflare surface in this organization.
  #
  # It is a separate job on a separate install for the same reason the site is outside
  # `pnpm-workspace.yaml`: `pnpm verify` runs `pnpm audit --audit-level moderate` over a
  # workspace carrying seven hand-curated transitive-CVE overrides, and putting Next and
  # Fumadocs in that workspace would land every Next transitive advisory on the release gate.
  # The site has its own npm lockfile and its own tree, and the release gate never sees it.
  #
  # Without this job a page that failed to render would reach main green, because nothing in
  # `verify` builds the site.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every page is dated from the last commit that changed its source — the sitemap's
          # <lastmod> and the "last updated" line, and for a package page that source is the
          # README it renders. A shallow clone has no history to read, so every page would
          # silently date to the build. `check:export` refuses a sitemap with a missing date,
          # so this is enforced rather than merely intended.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck   # the app, then the Pages Function under functions/ (Workers types, not DOM)
      - run: npm run build       # `prebuild` regenerates the package pages from packages/*/README.md first
      # A green build proves the export compiled, not that it carries anything. This asserts on
      # the bytes in out/: the files the site promises, a page for every package the manifests
      # say is published and none for one they say is private, every sitemap URL dated, no
      # third-party origin anywhere in the export, and Markdown exports that are Markdown.
      - run: npm run check:export
