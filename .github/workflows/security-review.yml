# AI security review on every pull request.
#
# This complements CodeQL rather than duplicating it. CodeQL (security-extended) finds pattern-shaped
# defects — injection sinks, unsafe APIs, taint paths it has queries for. It does not find PROTOCOL logic
# failures, and those are this repository's real attack surface: a verification path that returns a positive
# verdict on an error arm, an absent field read as permission rather than refusal, a coercion that turns a
# malformed input into a confident `true`. Every such defect found here so far was found by reading, not by
# a scanner. This puts a reader on every diff.
#
# Runs on `pull_request` only. That is deliberate — a public repository invites PRs, and CONTRIBUTING.md
# points contributors at a review surface that must exist before they arrive.
#
# TRUST NOTE, and it matters for this codebase specifically: an AI reviewer reads the diff, and a diff from
# an untrusted fork is attacker-controlled text. CVE-2025-59536 is the class — instructions embedded in code
# comments or documentation that the reviewer interprets as commands. Mitigations held here:
#   - `permissions` are least-privilege: no `contents: write`, no secrets beyond the API key.
#   - `persist-credentials: false` so the checkout leaves no usable git credential in the workspace.
#   - `pull_request` (not `pull_request_target`) so a fork PR runs WITHOUT repository secrets by default.
#     This means fork PRs will skip the review rather than run it with credentials — the safe failure.
# The prompt-injection boundary is architectural in the protocol itself (TRM-4); it should be architectural
# in the tooling that reviews the protocol too.
name: security-review

on:
  pull_request:

# Least privilege. `pull-requests: write` is only for posting the review comment.
permissions:
  contents: read
  pull-requests: write

# One review per PR head; a new push supersedes an in-flight run rather than racing it.
concurrency:
  group: security-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Two populations cannot read Actions secrets, and the action fails on a missing key. Skip both rather
    # than fail red — neither can fix the gate they would see broken.
    #   1. Fork PRs: `pull_request` runs them without repository secrets by design.
    #   2. Dependabot: GitHub scopes Dependabot-triggered runs to the *Dependabot* secrets store, so an
    #      Actions secret is empty here. Dependabot branches are in-repo, so the fork test alone lets them
    #      through. To actually review Dependabot PRs, add CLAUDE_API_KEY as a Dependabot secret and drop
    #      the second clause.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # fetch-depth 2 is what the action needs to diff the PR head against its base.
          fetch-depth: 2
          persist-credentials: false

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main @ 2026-02-11
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          upload-results: true
          # `vectors/` is the conformance corpus — test data by construction, and gitleaks already covers it
          # for credentials. Excluding it keeps the reviewer on code it can reason about.
          exclude-directories: vectors,dist,node_modules
