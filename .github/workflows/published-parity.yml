name: published-parity

# Does every PUBLISHED package still match the source it was cut from?
#
# Every gate in `verify` reads the working tree. A version already on the registry can disagree with the
# source that carries its number, and no file here can see that: the build is correct, the suite passes over
# correct source, and the tarball a consumer installs is a different object. Measured in the sibling
# repository, exactly that shipped six defects across two packages while every gate there stayed green.
#
# ★ INSTALLED WHILE THIS TREE IS CLEAN. `M` 2026-09-14 all 31 publishable packages match byte for byte, so
# this job's green means "nothing regressed" rather than "the known backlog is still there". That is the
# whole value, and it is only available before a repository drifts.
#
# SIX-HOURLY, and not per-push, for `drift-guard`'s reason stated about a different subject: the event this
# watches is a PUBLISH, which does not happen on the same schedule as commits. A failure is never caused by
# the commit that triggered it, so attaching it to `push` would blame the wrong change and add 31 registry
# reads to every commit.
#
# It is deliberately NOT part of `verify` or `ci`: `verify` must stay runnable without the network, and this
# job's entire subject is on the network.
#
# No secrets. Public registry metadata and public tarballs, read-only.

on:
  schedule:
    # The minute is offset off the hour because scheduled workflows queue behind everything GitHub runs
    # at :00. A published version is immutable, so overlapping with any other registry-reading job is
    # harmless and no future scheduling change needs to preserve a gap.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          # No install and no build: the gate imports nothing outside `node:`, by design, so that a
          # dependency problem can never be mistaken for a parity problem.

      - name: Compare every published version against the source it was cut from
        # ⛔⛔ THE EXIT CODE IS CAPTURED RATHER THAN ALLOWED TO FAIL THE STEP, because this gate has FOUR
        # answers and three of them are not "pass": 1 drift, 2 nothing comparable, 3 the instrument failed.
        # Letting the step fail would collapse them into one red, and the run would report "a published
        # version is behind its source" over a run that measured nothing — asserting a defect nobody
        # measured, which is the flattering error's mirror image and just as wrong.
        #
        # ⚠️ `shell: bash` is NOT here for pipefail — this step is deliberately incapable of failing and the
        # pipeline's own `$?` is never read. It is here because `PIPESTATUS` does not exist in `sh`, which a
        # bare `run:` may fall back to, and `PIPESTATUS[0]` is the whole mechanism.
        id: parity
        shell: bash
        run: |
          set +e
          node scripts/check-published-parity.mjs 2>&1 | tee /tmp/parity.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      # ⛔ THE FOUR ANSWERS STAY FOUR ANSWERS, all the way to what a reader sees. THIS workflow files no
      # issues — `drift-guard` simply fails too — so the distinction lives in the annotation rather than in
      # an issue title. A job that reds is the signal; WHICH red it is must survive.
      #
      # ⚠️ `M` 2026-09-17: this note read *"this repository files no issues from any workflow"*, which was
      # true when it was written and stopped being true on 2026-09-16, when `published-dist-parity.yml`
      # landed with three issue types and a close loop. ⛔ It was then read from the outside as a statement
      # about the repository and repeated as one. A sentence about a file must say which file.
      #
      # ⛔⛔ AND THE PARTITION IS EXHAUSTIVE BY CONSTRUCTION. 127 (node missing), 137 (OOM) or any code a
      # future edit adds falls to the final arm. Without it those are a GREEN, SILENT job — and because the
      # step above cannot fail, nothing else would catch them.
      - name: Say which of the four answers this was, and fail unless it is parity
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.parity.outputs.code }}
        run: |
          case "${CODE:-missing}" in
            0)
              echo "✓ every published version matches the source it was cut from, byte for byte."
              ;;
            1)
              echo "::error title=published-parity: DRIFT::A published version does not carry the bytes this repository says it ships. A republish of the same version is not the remedy and is not possible — the remedy is a version bump and a release. See the log for the ABSENT and DIFFERENT files."
              exit 1
              ;;
            2)
              echo "::error title=published-parity: NOTHING MEASURED::Fewer packages were comparable than the floor requires, so nothing conclusive was compared. This is NOT drift and NOT parity — it is an absence of coverage. A package leaving the comparable set (a dropped src from files, an unpublish, a rename) takes its own coverage with it."
              exit 1
              ;;
            3)
              echo "::error title=published-parity: INSTRUMENT FAILED::The check could not measure — an unreachable registry, an unfetchable tarball, or an unreadable source path. This says NOTHING about whether any published artifact is behind its source."
              exit 1
              ;;
            *)
              echo "::error title=published-parity: UNMODELLED STATE::The check exited '${CODE:-<empty: it never ran>}', which is none of 0, 1, 2 or 3 — or a step before it failed. Nothing here is a claim about any published artifact; it is a claim about this workflow."
              exit 1
              ;;
          esac
