# The lcp-anchor Daml package.
#
# Build with the Daml SDK, then upload the resulting DAR to your participant:
#
#     daml build                       # -> .daml/dist/lcp-anchor-<version>.dar
#     daml ledger upload-dar --host <participant> .daml/dist/lcp-anchor-*.dar
#
# The version in that name is the `version:` below, which a test holds equal to the npm package's. Writing
# it out here pins a number that moves every release, so it is a glob.
#
# The PACKAGE ID is the hash of the compiled DAR, so it is deployment-specific and is supplied to this
# library per call (`lcpAnchorTemplateId(packageId)`) rather than hardcoded. That is why this package ships
# SOURCE rather than a prebuilt artifact: a `.dar` in the tarball would pin one SDK version and still yield
# a package id the deployment has to read off its own upload.
sdk-version: 2.10.4
name: lcp-anchor
version: 0.15.1
source: .
dependencies:
  - daml-prim
  - daml-stdlib
