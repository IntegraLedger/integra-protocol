packages:
  - "packages/*"
# @swc/core's build script is deliberately NOT run (decision: false): its native parser binding is the
# prebuilt @swc/core-<platform> optional dependency (verified — parseSync works with the script ignored),
# and dependency-cruiser's swc parser needs only that binding. Keeping arbitrary postinstall execution
# off is the supply-chain posture; the ignoredBuiltDependencies list documents the deliberate skip.
# TWO KEYS, AND THEY ARE NOT REDUNDANT — do not consolidate them. I removed `allowBuilds` on 2026-08-12
# reasoning that it duplicated the list below and is absent from `pnpm install --help`; CI failed on the
# next push with `ERR_PNPM_IGNORED_BUILDS` and a clean clone reproduces it. The two do different jobs:
#
#   allowBuilds              the DECISION. pnpm 11 refuses an install that silently skips a build script
#                            unless the choice is recorded, which is what `pnpm approve-builds` writes here.
#                            Without it `pnpm install --frozen-lockfile` EXITS 1.
#   ignoredBuiltDependencies the RECORD, for a reader — which packages are skipped, so the list is legible
#                            without inferring it from a map of `false`.
#
# The trap is that a warm `node_modules` does not re-run the decision, so `pnpm verify` stays green locally
# while a cold install fails. Test a change here with a fresh clone, never with an existing tree.
#
# bufferutil / utf-8-validate are OPTIONAL native accelerators of `ws`, pulled in transitively by the
# Solana devnet test's SDK; both have pure-JS fallbacks and the binding uses only HTTP RPC, so their
# native builds are deliberately skipped — same no-arbitrary-postinstall posture as @swc/core, whose native
# parser binding ships prebuilt as an optional dependency (verified: dependency-cruiser's swc parser works).
allowBuilds:
  '@swc/core': false
  bufferutil: false
  utf-8-validate: false
ignoredBuiltDependencies:
  - "@swc/core"
  - "bufferutil"
  - "utf-8-validate"
catalog:
  zod: "4.5.4" # trust boundaries only — never the kernel
  viem: "2.56.3" # EVM client / typed-data + 1271/6492 verify — the EVM bindings, and the escrow drift guard
  multiformats: "14.0.5" # raw-CIDv1 content addressing (CID == atrHash) — evidence bundles
  "@solana/kit": "8.2.0" # Solana devnet integration test only — binding-solana ships NO chain SDK
  bs58: "6.0.0" # base58 decode for a memo instruction the RPC returns partially-decoded (binding-solana)
  "@mysten/sui": "2.29.0" # Sui Pay402 payment_id native-field binding — isolated to binding-sui
  "@stellar/stellar-sdk": "17.0.1" # Stellar CAP-67 muxed-address native-field binding — StrKey/MuxedAccount; isolated to binding-stellar
  "@types/json-schema": "7.0.15" # canonical types for the `json-schema` module @stellar/stellar-sdk's contract/spec.d.ts imports (skipLibCheck:false workspace-wide) — dev-only, binding-stellar
  "@aptos-labs/ts-sdk": "7.3.0" # Aptos lcp_payment Move-module overlay-contract binding — isolated to binding-aptos
  ripple-binary-codec: "2.10.0" # XRPL memo hex codec — dev-only, the opt-in integration test signs with it (binding-xrpl)
  ripple-keypairs: "3.0.0" # XRPL test-wallet keys — dev-only, same opt-in integration lane (binding-xrpl)
  vitest: "5.0.0" # 5 changed the full-test-name separator to " > "; see patchedDependencies below
  fast-check: "4.9.0"
  "@cfworker/json-schema": "4.1.1" # 2020-12 validator for the conformance schema class (ESM, runtime-agnostic)
  "@types/node": "24.13.3" # FLOOR-pinned to engines (>=24) — types never exceed the oldest supported runtime
minimumReleaseAge: 1440 # supply-chain default: 24h quarantine on new releases

# pnpm ≥ 11's exotic-subdependency blocking (§3's other supply-chain default) ships on by default — no override.

# Transitive-CVE overrides. None is a direct dependency: each arrives under a third-party package pinning an
# older range, so forcing the patched version is the fix available to us. Reviewed on every audit run —
# delete an entry once the upstream's own range covers it.
overrides:
  # GHSA proxy-inheritance (high) + 9 moderates. Reaches consumers via the published binding-stellar.
  axios: ">=1.18.1"
  # Missing buffer bounds check in v3/v5/v6 when a buf is passed.
  uuid: ">=11.1.1"
  # qs <6.16.0 — TWO advisories, one entry. GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g (both moderate,
  # published 2026-09-02): denial of service through an attacker-controlled `isBuffer`, fixed in 6.16.0.
  # They supersede the advisory that first put this entry here (qs.stringify DoS on null entries in
  # comma-format arrays, fixed in 6.15.2). Dev-only and NOT a consumer path — the sole route is
  # @stryker-mutator/core > typed-rest-client, so nothing published reaches it. 6.16.0 was published
  # 2026-08-29 and is past `minimumReleaseAge`'s 24h quarantine. Caught by the audit stage of
  # `pnpm verify` against an unchanged tree.
  qs: ">=6.16.0"
  # GHSA-rgw5-rvv9-x895 (high): unbounded intermediate arrays, bypassing the CVE-2026-14257 mitigation.
  # Dev-only and NOT a consumer path — the sole route is @stryker-mutator/core > minimatch, so nothing
  # published reaches it. Caught on 2026-08-03 by the audit stage of `pnpm verify`, mid-release; the
  # advisory landed against the already-resolved 5.0.8 rather than arriving with any dependency change.
  brace-expansion: ">=5.0.9"
  # GHSA-fxqj-rqcc-2cmp (moderate, published 2026-08-03): the incomplete fix of GHSA-6g55-p6wh-862q — an
  # attacker-controlled sourceMappingURL still reads arbitrary .map files when `from` is unset. Dev-only:
  # the sole path is vite (under vitest), whose own range is `^8.5.16` and already admits the fix, and no
  # published package reaches it. Added AHEAD of the audit gate — npm's advisory DB had not yet picked this
  # up when it was added, so `pnpm audit` was still green on a version GitHub already flagged.
  postcss: ">=8.5.23"
  # nanoid <3.3.18 — TWO advisories, one entry. GHSA-2v37-7h3g-55p8 (high, published 2026-08-12): a custom
  # generator loops indefinitely when size is zero, fixed in 3.3.18. It supersedes the advisory that first
  # put this entry here (high, published 2026-08-07): predictable output, fixed in 3.3.17. Dev-only and NOT
  # a consumer path — the sole route is @stryker-mutator/vitest-runner > vitest > vite > postcss, so nothing
  # published reaches it. postcss@8.5.25 already declares `nanoid: ^3.3.16`, which PERMITS the patch;
  # nothing upstream forbids it, pnpm simply will not re-resolve a transitive dependency the lockfile
  # already satisfies. Both were caught by the audit stage of `pnpm verify` against an unchanged tree.
  # Bounded to the 3.x line ON PURPOSE: postcss declares `^3.3.16`, and an unbounded `>=3.3.18` resolves to
  # 6.x, which is ESM-only with a changed API — that would satisfy the auditor by breaking the dependency.
  # 3.3.18 is the newest 3.x and is now well past `minimumReleaseAge`'s 24h quarantine.
  nanoid: ">=3.3.18 <4"
  # fast-uri <4.1.3 — FOUR advisories, one entry. GHSA-5jgf-p345-68v8, GHSA-jqff-g426-hqxp,
  # GHSA-f65p-4m7j-42xc and GHSA-fph4-wmhf-6fwf (all high, published 2026-09-02), fixed in 4.1.3. They
  # supersede the advisory that first put this entry here — GHSA-7p8r-x3mc-p8w7 (high, published
  # 2026-08-03): host confusion via a backslash authority introducer, fixed in 3.1.5. Dev-only and NOT a
  # consumer path — the sole route is @stryker-mutator/core > ajv, so nothing published reaches it.
  # 4.1.3 was published 2026-08-23 and is past `minimumReleaseAge`'s 24h quarantine; 4.1.4 was published
  # the day these advisories were and is still inside it. Both caught by the audit stage of `pnpm verify`
  # against an unchanged tree.
  fast-uri: ">=4.1.3"

# ⛔⛔ A PATCHED TEST TOOL, AND THE ALTERNATIVE WAS A MUTATION GATE THAT LIES.
#
# `@stryker-mutator/vitest-runner` builds its per-mutant test filter by joining a test's suite names and
# its own name with a SINGLE SPACE (`collectTestName`, `nameParts.join(' ')`), turns that into a regex, and
# hands it to vitest as `testNamePattern`. vitest 5 composes the name it MATCHES that pattern against with
# `" > "` instead (`createTaskName(names, separator = " > ")`, matched against `t.fullTestName`). The two
# spellings are not the same string, so the pattern matches nothing.
#
# ⛔ AND THE FAILURE IS SILENT IN THE DANGEROUS DIRECTION. vitest does not error on a pattern that matches
# nothing — it SKIPS every test and exits 0. Measured here, in `packages/placements`, against vitest 5.0.0:
#
#     vitest run -t "the placement registry returns an adapter for a protocol that has one"
#         -> Test Files  1 skipped (1) / Tests  19 skipped (19)
#     vitest run -t "the placement registry > returns an adapter for a protocol that has one"
#         -> Test Files  1 passed (1)  / Tests  1 passed | 18 skipped (19)
#
# Stryker sees a run in which nothing failed and records the mutant SURVIVED. `placements` scored 35.19
# against its ratchet of 100 — 19 killed, 35 survived — and the 19 it did kill are EXACTLY its 19 static
# mutants, which are the only ones Stryker runs unfiltered. With the patch: 100.00, 54 killed, 0 survived.
#
# ⛔ IT IS NOT FIXABLE FROM CONFIGURATION. `coverageAnalysis` was measured at all three settings —
# `perTest`, `all` and `off` — and every one produced the identical 35.19, so there is no setting that
# steps around the filter. vitest exposes the separator as a default parameter, not as an option.
#
# ⚠️ AND IT WOULD HAVE GONE THE OTHER WAY SOMEWHERE ELSE. A package whose ratchet sits below the score its
# static mutants alone produce would have stayed GREEN over a suite that ran no tests at all. This gate's
# whole purpose is to be the thing that cannot quietly become vacuous, so a red here is the good outcome
# and the reason this is patched rather than waited out.
#
# ⭐ FOUR SITES, NOT ONE. `collectTestName` is duplicated in the package — `test-helpers` builds the ids
# the runner reports, `stryker-setup` builds the ids the in-test-environment hook reports, and both ship as
# `dist/` JavaScript and as `src/` TypeScript. The filter is built from the ids the SETUP hook produced, so
# patching the helper alone leaves the two halves spelling the same test differently. All four move together.
#
# ⛔ THE REMOVAL CONDITION, because a patch nobody retires is a fork. `10.0.0` is the newest release and it
# predates vitest 5 by three weeks (runner 2026-08-14, vitest 5.0.0 2026-09-03) — there is no published
# version that supports vitest 5. When one exists, DELETE this patch and this block rather than rebasing
# it: pnpm refuses a patch whose target version moved, so the bump cannot silently carry it forward.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
