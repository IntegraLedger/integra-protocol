name = "integra-protocol"
compatibility_date = "2026-08-30"
pages_build_output_dir = "out"

# Read by functions/_middleware.ts. "true" folds integra-protocol.pages.dev into the canonical
# host with a 301. The host is ruled — lcp-packages.integraledger.com, in src/lib/site.ts — but
# this STAYS "false" until that host is attached to this Pages project and answering 200: until
# then the .pages.dev alias is the only host that serves, and a 301 to a host that does not
# answer would take it down. See README.md "Deploying".
[vars]
CANONICAL_HOST_ATTACHED = "false"
