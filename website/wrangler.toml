# The documentation site as a Cloudflare Worker with static assets. No workflow deploys it: a maintainer runs
# `npx wrangler deploy -c website/wrangler.toml` at the repository root after the build writes website/out.
name = "integra-protocol-docs"
main = "worker.js"
compatibility_date = "2026-09-26"

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
# worker.js runs first for page addresses and their .md addresses, to answer a request for a page as Markdown. The
# files excluded below are served directly: the build's scripts and styles, the Markdown copies, the Twoslash popups,
# the LCP documents under /ucp/ and /a2a/, every .txt file (the RSC payload each page fetches, at any depth, and
# llms.txt, llms-full.txt and robots.txt) and the other generated files. Cloudflare does not apply _headers to a
# response the Worker returns, so worker.js sets on each the headers out/_headers gives its address.
run_worker_first = [
  "/*",
  "!/_next/*",
  "!/md/*",
  "!/twoslash/*",
  "!/ucp/*",
  "!/a2a/*",
  "!/.well-known/*",
  "!/api/search",
  "!/*.txt",
  "!/sitemap.xml",
  "!/icon.svg",
  "!/opengraph-image",
]
